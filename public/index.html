<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Omegle 2 — Anonymous Video Chat</title>
  <meta name="description" content="Meet random strangers over live video. Sign in with Google and get matched instantly.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>

  <!-- ══════════════════════════════════════════════════════════
       AUTH GATE — shown when signed out
       JS: $('gate').style.display = 'none' | 'block'
       ══════════════════════════════════════════════════════════ -->
  <div id="gate" style="display:none">
    <div class="gate-card">

      <div class="gate-brand">
        <span class="brand-wordmark">Omegle</span><span class="brand-accent">2</span>
      </div>

      <div class="gate-icon" aria-hidden="true">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
          <circle cx="9" cy="7" r="4"/>
          <path d="M23 21v-2a4 4 0 0 0-3-3.87"/>
          <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
        </svg>
      </div>

      <h1 class="gate-heading">Sign in to chat</h1>
      <p class="gate-sub">Anonymous one-on-one video chat with strangers. Google sign-in keeps bots out.</p>

      <button id="login" class="btn-google">
        <!-- Google "G" logo -->
        <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
          <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
          <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
          <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
        </svg>
        Continue with Google
      </button>

      <p class="gate-legal">By continuing you agree to be matched with strangers at random. Be kind.</p>
    </div>
  </div>

  <!-- ══════════════════════════════════════════════════════════
       MAIN APP — shown when signed in
       JS: $('app').style.display = 'none' | 'grid'
       ══════════════════════════════════════════════════════════ -->
  <div id="app" style="display:none">

    <!-- ── Header ──────────────────────────────────────────── -->
    <header class="app-header">
      <div class="header-brand">
        <div class="brand-logo" aria-hidden="true">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polygon points="23 7 16 12 23 17 23 7"/>
            <rect x="1" y="5" width="15" height="14" rx="2" ry="2"/>
          </svg>
        </div>
        <span class="brand-wordmark">Omegle</span><span class="brand-accent">2</span>
        <span class="brand-tagline" aria-hidden="true">— Anonymous video chat</span>
      </div>

      <!-- JS: $('account').style.display = 'none' | 'flex' -->
      <div id="account" class="header-account" style="display:none">
        <span id="who" class="account-email"></span>
        <button id="logout" class="btn btn-ghost">
          Sign out
        </button>
      </div>
    </header>

    <!-- ── Video Grid ───────────────────────────────────────── -->
    <main class="video-grid" aria-label="Video streams">

      <!-- Local video -->
      <div class="vid-card" id="local-card">
        <video id="local" autoplay playsinline muted></video>
        <!-- Shown before camera is started (no JS control — pure CSS via :has) -->
        <div id="local-overlay" class="vid-pre-overlay" aria-hidden="true">
          <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <polygon points="23 7 16 12 23 17 23 7"/>
            <rect x="1" y="5" width="15" height="14" rx="2" ry="2"/>
            <line x1="1" y1="1" x2="23" y2="23" stroke-width="2"/>
          </svg>
          <span>Camera off</span>
        </div>
        <div class="vid-label">You</div>
      </div>

      <!-- Remote video -->
      <div class="vid-card" id="remote-wrap">
        <video id="remote" autoplay playsinline></video>
        <!-- JS toggles display:flex / display:none -->
        <div id="remote-placeholder" class="vid-placeholder">
          <div class="placeholder-icon" aria-hidden="true">
            <svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="8" r="4"/>
              <path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/>
            </svg>
          </div>
          <span id="placeholder-text" class="placeholder-label">Waiting for stranger…</span>
        </div>
        <div class="vid-label">Stranger</div>
      </div>

    </main>

    <!-- ── Controls Dashboard ──────────────────────────────── -->
    <div class="controls-card" role="region" aria-label="Call controls">

      <!-- Status indicator -->
      <div class="status-section">
        <div class="status-pill">
          <!-- JS sets class: dot | dot on | dot warn | dot err -->
          <span id="dot" class="dot" aria-hidden="true"></span>
          <!-- JS sets textContent -->
          <span id="status" class="status-text">Not started</span>
        </div>
      </div>

      <!-- Action buttons -->
      <div class="btn-row">

        <!-- camera-off state only — JS: display '' | 'none' -->
        <button id="start" class="btn btn-secondary">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <polygon points="23 7 16 12 23 17 23 7"/>
            <rect x="1" y="5" width="15" height="14" rx="2" ry="2"/>
          </svg>
          Start camera
        </button>

        <!-- idle state only — JS: display '' | 'none' -->
        <button id="find" class="btn btn-primary" style="display:none" disabled>
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="11" cy="11" r="8"/>
            <line x1="21" y1="21" x2="16.65" y2="16.65"/>
          </svg>
          Find Stranger
        </button>

        <!-- connected state only — JS: display '' | 'none' -->
        <button id="next" class="btn btn-warning" style="display:none">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <polygon points="5 4 15 12 5 20 5 4"/>
            <line x1="19" y1="5" x2="19" y2="19"/>
          </svg>
          Next / Skip
        </button>

        <!-- searching or connected — JS: display '' | 'none' -->
        <button id="stop" class="btn btn-danger" style="display:none">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <rect x="3" y="3" width="18" height="18" rx="2.5"/>
          </svg>
          Stop
        </button>

      </div>
    </div>

  </div><!-- /#app -->

  <!-- Supabase (self-hosted, no external CDN) -->
  <script src="/vendor/supabase.js"></script>
  <!-- Socket.IO -->
  <script src="/socket.io/socket.io.js"></script>
  <!-- App modules — load order: auth → webrtc → main -->
  <script src="/js/auth.js"></script>
  <script src="/js/webrtc.js"></script>
  <script src="/js/main.js"></script>

</body>
</html>
